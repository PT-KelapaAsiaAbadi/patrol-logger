<html>
    <head>
        <meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="theme-color"
			content="#13202B" />
		<title>Login</title>
    </head>
    <body>
        <main>
            <h1>Login</h1>
            <p>Please enter your given username, and pin to sign in.</p>
            <form action="submit">
                <label for="username-input">Username</label>
				<input
					id="username-input"
					autocomplete="off"
					autocapitalize="characters" />
                
                <label for="">PIN</label>
                <input 
                    id="pin-input"
                    type="number"
                 />

                <!-- TODO: Add link to forgot pin/password page. -->
                <p><a href="TBA">Forgot your password? Click here.</a></p>

                <button>Submit</button>
            </form>
        </main>
    </body>
</html>
