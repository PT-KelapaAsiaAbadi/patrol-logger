<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Patrol demo</title>
    <style>
      /* Development only. The shell owns nothing but the two tabs, so the apps
         below are byte for byte the pages that ship. */
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font:
          400 16px/1.5 'Public Sans',
          system-ui,
          sans-serif;
        background: #eef1f4;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        background: #0f1720;
        color: #f4f6f8;
      }
      .app-name {
        margin: 0;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      nav {
        display: flex;
        gap: 8px;
      }
      button {
        padding: 8px 14px;
        border: 1px solid #3a4652;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button[aria-selected='true'] {
        border-color: #f2c230;
        background: #f2c230;
        color: #1a1a1a;
        font-weight: 700;
      }
      .note {
        margin-left: auto;
        font-size: 14px;
        color: #9aa7b4;
      }
      .frames {
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        padding: 16px;
        gap: 16px;
      }
      iframe {
        border: 0;
        background: #fff;
        box-shadow: 0 1px 4px rgba(15, 23, 32, 0.25);
      }
      iframe[hidden] {
        display: none;
      }
      #frame-guard {
        width: 390px;
        max-width: 100%;
        border-radius: 12px;
      }
      #frame-staff {
        width: 100%;
        border-radius: 6px;
      }
      @media (max-width: 480px) {
        .frames {
          padding: 0;
        }
        #frame-guard {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="app-name">Patrol</p>
      <nav aria-label="Apps">
        <button id="tab-guard" data-app="guard" aria-selected="true">Guard app</button>
        <button id="tab-staff" data-app="staff" aria-selected="false">Staff</button>
      </nav>
      <span class="note">Demo. All data stays in this browser.</span>
    </header>

    <div class="frames">
      <iframe id="frame-guard" title="Guard app" src="../../apps/guard/" allow="camera; geolocation"></iframe>
      <iframe id="frame-staff" title="Staff app" src="../../apps/staff/" hidden></iframe>
    </div>

    <script>
      // The two apps run in separate documents and share data through this
      // origin's storage, so the one being shown is reloaded to pick up whatever
      // the other just wrote.
      //
      // `npm run build:demo` drops the iframes' src and adds a base64 copy of
      // each app instead. Those are written into the blank frames rather than
      // set as srcdoc, because a srcdoc frame gets an opaque origin and would
      // not share storage with anything.
      const frames = {
        guard: document.getElementById('frame-guard'),
        staff: document.getElementById('frame-staff'),
      };
      const tabs = document.querySelectorAll('nav button');

      function inlinedApp(name) {
        const block = document.getElementById('inline-' + name);
        if (!block) return null;
        const bytes = Uint8Array.from(atob(block.textContent.trim()), (c) => c.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function load(name) {
        const frame = frames[name];
        const html = inlinedApp(name);
        if (html === null) {
          frame.contentWindow.location.reload();
          return;
        }
        const doc = frame.contentDocument;
        doc.open();
        doc.write(html);
        doc.close();
      }

      function show(name) {
        for (const tab of tabs) tab.setAttribute('aria-selected', String(tab.dataset.app === name));
        for (const [app, frame] of Object.entries(frames)) {
          const showing = app === name;
          if (showing && frame.hidden) load(app);
          frame.hidden = !showing;
        }
      }

      for (const tab of tabs) tab.addEventListener('click', () => show(tab.dataset.app));

      // In the built demo the frames start blank, so fill the visible one.
      if (inlinedApp('guard') !== null) load('guard');
    </script>
  </body>
</html>
