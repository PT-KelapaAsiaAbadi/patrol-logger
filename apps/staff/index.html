<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Patrol staff</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="styles/dashboard.css" />
    <link rel="stylesheet" href="styles/setup.css" />

    <!-- Classic script that defines window.qrcode, for drawing printable codes. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <header class="app-header">
      <p class="app-name">Patrol</p>
      <nav aria-label="Views">
        <button class="view-tab" data-view="dashboard" aria-selected="true">Dashboard</button>
        <button class="view-tab" data-view="setup" aria-selected="false">Setup</button>
      </nav>
      <span class="prototype-note">Prototype. All data stays in this browser.</span>
    </header>

    <main id="dashboard" class="view is-active" aria-label="Dashboard">
      <div class="page" id="dashboard-content"></div>
    </main>

    <main id="setup" class="view" aria-label="Setup">
      <div class="page" id="setup-content"></div>
    </main>
  </body>
</html>
